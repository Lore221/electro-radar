plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots' }
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    // Версии перенесены из Power-radar для Minecraft 1.21.1; slim-вариант Create
    // не дублирует NeoForge и зависимости, которые подключены ниже отдельно.
    implementation("com.simibubi.create:create-${project.minecraft_version}:6.0.10-280:slim") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:1.0.82+mc${project.minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${project.minecraft_version}:1.0.6"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}:1.0.6"
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

sourceSets.main.resources.srcDir('src/generated/resources')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
